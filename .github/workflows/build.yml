name: Build SukiSU Kernel for Civi 1s
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # 每周一凌晨2点检查更新
    - cron: '0 2 * * 1'

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      latest_version: ${{ steps.check.outputs.latest_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for kernel updates
        id: check
        run: |
          # 获取当前内核版本
          CURRENT_VERSION=$(cat KERNEL_VERSION 2>/dev/null || echo "5.4.86")
          echo "Current version: $CURRENT_VERSION"
          
          # 获取最新的Linux 5.4.x版本
          LATEST_VERSION=$(curl -sL "https://cdn.kernel.org/pub/linux/kernel/v5.x/" | \
            grep -oP 'patch-5\.4\.\d+\.xz' | \
            grep -oP '5\.4\.\d+' | \
            sort -V | \
            tail -1)
          
          echo "Latest version: $LATEST_VERSION"
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          
          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "New kernel version available: $LATEST_VERSION"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Already up to date"
          fi

  build:
    needs: check-and-update
    if: needs.check-and-update.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /opt/ghc
          df -h

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Cache toolchain
        uses: actions/cache@v4
        id: cache-toolchain
        with:
          path: ~/toolchains/clang
          key: ${{ runner.os }}-clang-r416183b

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            liblz4-tool libncurses-dev libssl-dev \
            libxml2-utils lzop rsync squashfs-tools \
            xsltproc zip zlib1g-dev python3 python3-pip \
            cpio
          
          # 安装ARM交叉编译工具链
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu || true

      - name: 下载 Clang 工具链
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains
          git clone --depth=1 --single-branch \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b \
            clang

      - name: 拉取内核源码
        run: |
          git clone --depth=1 --single-branch \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource \
            -b zijin-s-oss kernel_src

      - name: 获取内核版本信息
        run: |
          cd kernel_src
          KERNEL_VERSION=$(make kernelversion 2>/dev/null || grep -E "^VERSION|^PATCHLEVEL|^SUBLEVEL" Makefile | awk '{print $3}' | tr '\n' '.' | sed 's/\.$//')
          echo "Kernel version: $KERNEL_VERSION"
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV

      - name: 集成 SukiSU-Ultra & SUSFS
        run: |
          cd kernel_src
          # 添加重试机制
          for i in {1..3}; do
            if curl -LSs --connect-timeout 30 --max-time 300 \
              "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | \
              bash -s susfs-v1.5.5; then
              echo "KernelSU integrated successfully"
              break
            else
              echo "Attempt $i failed, retrying..."
              sleep 5
            fi
          done

      - name: 应用兼容性补丁
        run: |
          cd kernel_src
          # 应用Linux 5.4兼容性补丁
          if [ -f "$GITHUB_WORKSPACE/patches/apply-kernelsu-compat.sh" ]; then
            bash "$GITHUB_WORKSPACE/patches/apply-kernelsu-compat.sh" || echo "Some patches may have failed, continuing..."
          fi

      - name: 修改内核配置
        run: |
          cd kernel_src
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          # 备份原始配置
          cp "$DEFCONFIG" "$DEFCONFIG.backup"
          
          # 添加KernelSU相关配置
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_KSU_VERSION_H=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          EOF
          
          # 显示配置差异
          echo "Config changes:"
          diff -u "$DEFCONFIG.backup" "$DEFCONFIG" || true

      - name: 开始编译内核
        id: compile
        run: |
          cd kernel_src
          
          # 设置环境变量
          export PATH=~/toolchains/clang/bin:$PATH
          export KBUILD_BUILD_HOST=GitHub-Actions
          export KBUILD_BUILD_USER=Auto-Build
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 清理之前的构建
          make mrproper
          
          # 生成配置
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig
          
          # 编译内核
          if make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            2>&1 | tee build.log; then
            echo "Kernel compiled successfully"
            echo "compile_success=true" >> $GITHUB_OUTPUT
          else
            echo "Kernel compilation failed"
            echo "compile_success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 验证构建产物
        if: steps.compile.outputs.compile_success == 'true'
        run: |
          if [ ! -f kernel_src/out/arch/arm64/boot/Image ]; then
            echo "Kernel Image not found!"
            exit 1
          fi
          
          ls -lh kernel_src/out/arch/arm64/boot/Image
          file kernel_src/out/arch/arm64/boot/Image

      - name: 准备 AnyKernel3 打包
        if: steps.compile.outputs.compile_success == 'true'
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          rm -rf AnyKernel3/.git*
          
          cp kernel_src/out/arch/arm64/boot/Image AnyKernel3/
          
          # 配置AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=civi1s/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=civi_1s/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=civi/g' AnyKernel3/anykernel.sh
          
          # 创建发布包
          VERSION="${{ env.KERNEL_VERSION }}"
          DATE=$(date +%Y%m%d)
          OUTPUT_NAME="SukiSU-Kernel-Civi1s-v${VERSION}-${DATE}"
          
          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/${OUTPUT_NAME}.zip" .
          
          echo "output_name=$OUTPUT_NAME" >> $GITHUB_ENV

      - name: 上传构建结果
        if: steps.compile.outputs.compile_success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.output_name }}
          path: ${{ env.output_name }}.zip
          retention-days: 30

      - name: 创建版本标签
        if: steps.compile.outputs.compile_success == 'true' && github.event_name != 'pull_request'
        run: |
          VERSION="${{ env.KERNEL_VERSION }}"
          DATE=$(date +%Y%m%d)
          TAG_NAME="v${VERSION}-${DATE}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 保存内核版本
          echo "$VERSION" > KERNEL_VERSION
          
          git add KERNEL_VERSION
          git commit -m "chore: update kernel to $VERSION" || true
          git tag -a "$TAG_NAME" -m "Kernel version $VERSION - Build $DATE"
          
          git push origin HEAD:main || true
          git push origin "$TAG_NAME" || true

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            kernel_src/build.log
            kernel_src/out/.config
          retention-days: 7