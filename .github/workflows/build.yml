name: Build SukiSU Kernel for Civi 1s
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt install -y curl python2 llvm lld wget git ccache automake flex lzop bison gperf build-essential zip zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler kmod python3

      - name: 下载工具链
        run: |
          mkdir -p toolchains
          cd toolchains
          wget -O clang.tar.gz https://kali.download/nethunter-images/toolchains/clang-r416183b1.tar.gz
          tar -xf clang.tar.gz
          mv clang-r416183b1 clang-aosp
          wget https://kali.download/nethunter-images/toolchains/google_aarch64-4.9.tar.xz
          wget https://kali.download/nethunter-images/toolchains/google_armhf-4.9.tar.xz
          tar -xf google_aarch64-4.9.tar.xz
          tar -xf google_armhf-4.9.tar.xz

      - name: 拉取内核源码
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b zijin-s-oss kernel_src

      - name: 集成 SukiSU-Ultra & SUSFS
        run: |
          cd kernel_src
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-v1.5.5

      - name: 修改内核配置 (Enable KSU/SUSFS)
        run: |
          cd kernel_src
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          cat >> $DEFCONFIG << EOF
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_KSU_VERSION_H=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          EOF

      - name: 开始编译
        run: |
          cd kernel_src
          export PATH=$GITHUB_WORKSPACE/toolchains/clang-aosp/bin:$GITHUB_WORKSPACE/toolchains/aarch64-4.9/bin:$GITHUB_WORKSPACE/toolchains/armhf-4.9/bin:$PATH
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=Piracola
          
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            gki_defconfig
          
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: 准备 AnyKernel3 打包
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          rm -rf AnyKernel3/.git*
          cp kernel_src/out/arch/arm64/boot/Image AnyKernel3/
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=civi1s/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=civi_1s/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=civi/g' AnyKernel3/anykernel.sh

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-Civi1s
          path: AnyKernel3/*
