name: Build SukiSU Kernel for Civi 1s
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: 下载 Google Clang 工具链
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchains
          cd $GITHUB_WORKSPACE/toolchains
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang

      - name: 拉取内核源码
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b zijin-s-oss kernel_src

      - name: 集成 SukiSU-Ultra & SUSFS
        run: |
          cd kernel_src
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-v1.5.5

      - name: 修改内核配置 (Enable KSU/SUSFS)
        run: |
          cd kernel_src
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          cat >> $DEFCONFIG << EOF
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_KSU_VERSION_H=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          EOF

      - name: 开始编译
        run: |
          cd kernel_src
          
          export PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=Piracola
          
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            gki_defconfig
          
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android-

      - name: 准备 AnyKernel3 打包
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          rm -rf AnyKernel3/.git*
          cp kernel_src/out/arch/arm64/boot/Image AnyKernel3/
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=civi1s/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=civi_1s/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=civi/g' AnyKernel3/anykernel.sh

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-Civi1s
          path: AnyKernel3/*
